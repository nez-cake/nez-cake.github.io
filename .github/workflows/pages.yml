# web/ 폴더를 https://nez-cake.github.io/ 로 배포한다.
# 올리기(build)와 내보내기(deploy)를 두 단계로 나눈다. 한 단계에 넣으면
# 방금 올린 묶음을 내보내기 단계가 못 찾는 일이 있었다.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # 목업과 연습용 화면 사진은 손님 페이지에 올리지 않는다.
      - run: rm -rf web/mockups
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
